  <h1>比亚迪公布年度业绩</h1>
  <p>比亚迪股份有限公司今日公布年度业绩，新能源汽车销量继续增长。公司管理层表示将继续投入电池研发，并扩大海外市场。</p>
  <p>分析人士认为，此次业绩反映了中国电动汽车行业的整体趋势，同时也显示出口业务正在成为新的增长点。集团旗下的刀片电池技术获得了更多国际合作伙伴的认可，多个欧洲品牌已签署供货协议。</p>
  <p>财务数据显示，本年度营业收入同比增长约百分之二十五，净利润亦创历史新高。管理层在业绩发布会上重申了在东南亚及中东市场加速拓展的战略目标，并计划于明年在匈牙利正式投产首个欧洲工厂。</p>
